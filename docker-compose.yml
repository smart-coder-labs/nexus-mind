version: "3.9"
services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_PATH: /data/nexusmind.db
      LOG_LEVEL: info
    volumes:
      - nexusmind_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  nexusmind_data:
