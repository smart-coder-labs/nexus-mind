# NexusMind backend as a native k3s workload on the oracle box, served through
# the EXISTING Traefik ingress (no separate Caddy, no host 80/443 grab).
# This is the coexistence-safe design: Traefik owns 80/443 and routes both the
# vend platform and api.nexusmind by Host header.
#
# Secrets are NOT in this file — created imperatively at deploy time. See README.md:
#   - ghcr-pull      (imagePullSecret for the private GHCR image)
#   - nexusmind-env  (all backend env vars)
# The PVC must be SEEDED with the DB backup before/at first apply (see README.md).
---
apiVersion: v1
kind: Namespace
metadata:
  name: nexusmind
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexusmind-data
  namespace: nexusmind
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusmind-backend
  namespace: nexusmind
  labels:
    app: nexusmind-backend
spec:
  replicas: 1
  # RWO local-path volume can attach to only one pod at a time, so a rolling
  # update would deadlock (new pod can't mount while old holds it). Recreate.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nexusmind-backend
  template:
    metadata:
      labels:
        app: nexusmind-backend
    spec:
      # The factory-worker identity (task pods in nexusmind-sandbox) belongs to the
      # worker only. The API container shares this pod, so no token is mounted
      # pod-wide: the worker alone gets a projected token below.
      serviceAccountName: factory-worker
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: prepare-autonomous-agent-storage
          image: ghcr.io/smart-coder-labs/nexusmind-backend:main-arm64
          imagePullPolicy: Always
          command: ["sh", "-c", "mkdir -p /data/claude-home"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: backend
          image: ghcr.io/smart-coder-labs/nexusmind-backend:main-arm64
          # Stable tag -> Always so a `rollout restart` picks up a new digest.
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: nexusmind-env
          env:
            - name: AUTONOMOUS_AGENTS_ENABLED
              value: "true"
            - name: CLAUDE_CODE_BIN
              value: /usr/local/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe
            - name: HOME
              value: /claude-home
          volumeMounts:
            - name: data
              mountPath: /data
            # Persist the fastembed ONNX model cache so it survives restarts.
            # The runtime download from HuggingFace is flaky (huggingface.co
            # resolves to IPv6 but the pod has no IPv6 egress, so ~half of cold
            # starts fail to fetch onnx/model.onnx). Once it downloads once into
            # this PVC-backed dir, every future start reuses it — no re-download.
            - name: data
              mountPath: /app/.fastembed_cache
              subPath: fastembed-cache
            # Persist Claude Code's complete HOME: it uses both ~/.claude and
            # ~/.claude.json for authentication/configuration state.
            - name: data
              mountPath: /claude-home
              subPath: claude-home
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            # ~2 min budget: the nomic-embed ONNX model init takes ~35s on ARM.
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 6Gi
        # Exactly one worker for the MVP. It shares SQLite and Claude Code's
        # persisted host identity with the API container in this single pod.
        - name: autonomous-worker
          image: ghcr.io/smart-coder-labs/nexusmind-backend:main-arm64
          imagePullPolicy: Always
          command: ["/app/autonomous_worker"]
          envFrom:
            - secretRef:
                name: nexusmind-env
          env:
            - name: AUTONOMOUS_AGENTS_ENABLED
              value: "true"
            - name: CLAUDE_CODE_BIN
              value: /usr/local/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe
            - name: HOME
              value: /claude-home
            # The AI Content Manager generates post imagery by shelling out to the
            # Higgsfield CLI. That CLI keeps a browser-OAuth session in
            # $HOME/.config/higgsfield, so it is installed into the PVC (which HOME
            # points at) rather than baked into the image — a login inside the image
            # would be lost on every deploy. The npm prefix used is
            # /claude-home/.npm-global, so its bin directory has to be on PATH here:
            # the image's own PATH does not include it, and the worker passes its
            # PATH straight through to the generator.
            #   npm i -g --prefix /claude-home/.npm-global @higgsfield/cli
            #   higgsfield auth login   (interactive, once, inside the container)
            # Without the CLI, content agents still run and simply post text only.
            - name: PATH
              value: /claude-home/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            # Absolute base the Judge template uses to embed durable evidence image
            # URLs (the public /evidence re-signing endpoint) in GitHub comments.
            - name: PUBLIC_API_BASE_URL
              value: https://api.nexusmind.smartcoderlabs.com
            # Factory F1: task pod image. FACTORY_PROXY_SIGNING_KEY comes from
            # nexusmind-env. Agents run sandboxed only with isolation=sandbox until
            # FACTORY_ISOLATION_DEFAULT=sandbox is set (after the drill).
            - name: FACTORY_SANDBOX_IMAGE
              value: ghcr.io/smart-coder-labs/nexusmind-backend:main-arm64
            # Orgs whose PR metadata may go to the decision model (Jev, TypeSafe)
            # for F3 shadow decisions. SmartCoderLabs only, by owner decision
            # (ADR 7d6f870f); every other tenant needs its own opt-in.
            - name: FACTORY_JEV_SHADOW_ORGS
              value: bdf4b2aa-3f52-422e-8bee-a1babbb7d337
            # Codex executor (ADR 74e25f77): USD per 1M tokens [input, cached input,
            # output]. A Codex run whose model has no price does not start. These
            # are OpenAI's long-context (>272K input) standard-tier rates, checked
            # 2026-10-05 at developers.openai.com/api/docs/pricing: the cost cap
            # overestimates rather than letting a run overspend. Cached long-context
            # input is not published separately; 2x the short rate is assumed.
            - name: FACTORY_OPENAI_PRICES
              value: '{"gpt-6-luna":[0.20,0.02,0.75],"gpt-6.1-sol":[4.00,0.20,15.00],"gpt-6-astra":[20.00,2.00,75.00]}'
            # OTel GenAI spans (factory F3): one `invoke_agent` span per finished run
            # (provider, model, tokens, cost, tier, outcome; never prompt or repo
            # text). Off until a collector exists: with no endpoint nothing is built.
            # To enable, set here (an auth header belongs in nexusmind-env instead):
            #   OTEL_EXPORTER_OTLP_ENDPOINT  base OTLP/HTTP URL, e.g.
            #                                http://otel-collector:4318 (/v1/traces is appended)
            #   OTEL_EXPORTER_OTLP_HEADERS   optional, e.g. authorization=Bearer%20<token>
            #   OTEL_SERVICE_NAME            optional, defaults to nexusmind-worker
          volumeMounts:
            - name: data
              mountPath: /data
            - name: data
              mountPath: /claude-home
              subPath: claude-home
            - name: factory-worker-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 6Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nexusmind-data
        # What automount would have provided, for the worker container only.
        - name: factory-worker-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: {fieldPath: metadata.namespace}
---
apiVersion: v1
kind: Service
metadata:
  name: nexusmind-backend
  namespace: nexusmind
spec:
  selector:
    app: nexusmind-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexusmind-backend
  namespace: nexusmind
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    # Real Let's Encrypt cert for the production host, issued by the namespaced
    # DNS-01 (Cloudflare) Issuer `letsencrypt-dns-cf` into secret `nexusmind-tls`.
    # nip.io host is intentionally omitted -> served with Traefik's default cert.
    - hosts:
        - api.nexusmind.smartcoderlabs.com
      secretName: nexusmind-tls
  rules:
    # Testing host (Traefik default/self-signed cert — like the vend *.nip.io).
    - host: nexusmind.149.130.166.34.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexusmind-backend
                port:
                  number: 8080
    # Production host for the DNS cutover. Real TLS is a cutover follow-up
    # (cert-manager + Cloudflare DNS-01, or a TLS secret) — see README.md.
    - host: api.nexusmind.smartcoderlabs.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexusmind-backend
                port:
                  number: 8080
