# Self-host stack for the u2s box (AWS t3.medium).
# Pulls PRE-BUILT images from GHCR — it does NOT build on the box (a 4 GiB
# t3.medium OOMs / crawls compiling the Rust backend). Images are produced and
# pushed by .github/workflows/deploy-u2s.yml.
#
# Requires a .env file next to this compose (written by the deploy workflow):
#   GHCR_OWNER=<lowercase github owner>
#   SUPERUSER_KEY=<secret>
#   U2S_ADMIN_EMAIL=<admin email>     # consumed by bootstrap-u2s.sh only
#   U2S_ADMIN_NAME=<admin name>       # consumed by bootstrap-u2s.sh only
#
# Ports (open these inbound in the AWS Security Group to your audience):
#   8080 -> backend API / MCP base URL
#   3000 -> admin panel (proxies /v1 to backend on the internal compose network)
services:
  backend:
    image: ghcr.io/${GHCR_OWNER}/nexusmind-backend:main
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_PATH: /data/nexusmind.db
      LOG_LEVEL: info
      # Semantic memory search. Without it every `semantic` or `hybrid` query
      # silently degrades to keyword — it does not fail, it just answers worse,
      # which is how this went unnoticed until 2,907 migrated entries were in
      # and "puedo modificar el modelo Mensaje de prisma" returned "Notas
      # adicionales" while the memory answering it verbatim ranked nowhere.
      #
      # Costs ~550 MB of disk: the nomic-embed-text-v1.5 ONNX weights are
      # fetched on first start and cached in the container. On this 6.7 GB box
      # that is worth watching after a deploy — see the prune step in
      # docs/RUNNING.md.
      NEXUSMIND_EMBED_ENABLED: "true"
      # Auth for the superuser-only endpoints (POST/GET /v1/orgs). Also gates the
      # one-time single-org bootstrap. Never baked into the image — env only.
      SUPERUSER_KEY: ${SUPERUSER_KEY}
      # ⚠️  SECURITY DEBT — REMOVE THIS ONCE THE BOX IS BEHIND TLS. ⚠️
      # This box is served over PLAIN HTTP on a bare IP (http://<ip>:3000).
      # Browsers silently DROP a `Secure` cookie on an insecure origin, so with
      # the default (true) login returns 200 and the user is bounced straight
      # back to /login — the session cookie is never stored.
      #
      # The cost of this override: the session token travels in CLEARTEXT over
      # the public internet. Anyone on the network path can capture it and
      # impersonate the user. It is acceptable ONLY while access is restricted
      # to known source IPs in the AWS Security Group.
      #
      # Fix: put a reverse proxy with a real certificate in front (needs a
      # DOMAIN — Let's Encrypt will not issue for a bare IP), then delete this
      # line so the secure-by-default applies. Tracked in the repo issues.
      COOKIE_SECURE: "false"
    # Explicit memory ceiling: code indexing (tree-sitter ASTs + ONNX embeddings,
    # nomic-embed-text-v1.5) can spike. Batching bounds it; this fails the
    # container loudly instead of taking the 4 GiB host down on a runaway repo.
    mem_limit: 2g
    mem_reservation: 512m
    volumes:
      - nexusmind_data:/data
      # The ONNX weights, on a volume rather than in the container's writable
      # layer. They are ~550 MB, and in the layer that costs twice: the space is
      # held while the container runs AND the download repeats on every
      # recreate. On this 6.7 GB box that is what made two deploys fail
      # mid-pull with "no space left on device".
      - nexusmind_model_cache:/app/.fastembed_cache
    healthcheck:
      # start_period covers the ~35s embedding-model init before the port listens.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /v1/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  admin:
    image: ghcr.io/${GHCR_OWNER}/nexusmind-admin:main
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  nexusmind_model_cache:
  nexusmind_data:
