[package]
name = "nexusmind"
version = "0.2.0"
edition = "2021"
default-run = "nexusmind"

[[bin]]
name = "nexusmind"
path = "src/main.rs"

[[bin]]
name = "nexusmind-seed"
path = "src/bin/seed.rs"

[[bin]]
name = "backfill-embeddings"
path = "src/bin/backfill_embeddings.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
regex = "1"
bcrypt = "0.15"
tower-cookies = "0.10"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }
fastembed = { version = "4", default-features = false, features = ["ort-download-binaries", "hf-hub"] }
dashmap = "5"
csv = "1"
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
