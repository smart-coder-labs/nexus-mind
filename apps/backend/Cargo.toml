[package]
name = "nexusmind"
version = "0.2.0"
edition = "2021"
default-run = "nexusmind"

[[bin]]
name = "nexusmind"
path = "src/main.rs"

[[bin]]
name = "nexusmind-seed"
path = "src/bin/seed.rs"

[[bin]]
name = "backfill-embeddings"
path = "src/bin/backfill_embeddings.rs"

[[bin]]
name = "factory-egress-proxy"
path = "src/bin/factory_egress_proxy.rs"

[[bin]]
name = "import-sdd"
path = "src/bin/import_sdd.rs"

[[bin]]
name = "factory-golden-replay"
path = "src/bin/factory_golden_replay.rs"

[[bin]]
name = "factory-shadow"
path = "src/bin/factory_shadow.rs"

[[bin]]
name = "factory-retrieval-eval"
path = "src/bin/factory_retrieval_eval.rs"

[[bin]]
name = "migrate-knowledge"
path = "src/bin/migrate_knowledge.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rand = "0.8"
regex = "1"
globset = "0.4"
bcrypt = "0.15"
tower-cookies = "0.10"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }
fastembed = { version = "4", default-features = false, features = ["ort-download-binaries", "hf-hub"] }
dashmap = "5"
csv = "1"
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
# Sandbox egress proxy (factory F1): raw HTTP/1 server with CONNECT upgrades.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
# Sandbox executor (factory F1): task pods over the in-cluster Kubernetes API.
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring", "ws", "runtime"] }
k8s-openapi = { version = "0.28", features = ["v1_35"] }
jsonwebtoken = "9"
async-trait = "0.1"
tree-sitter = "0.26.10"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
rayon = "1.12.0"
aes-gcm = "0.10"
tempfile = "3"
memchr = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "macros"] }
# OTel GenAI spans for finished autonomous runs (factory F3), inert unless
# OTEL_EXPORTER_OTLP_ENDPOINT is set. 0.31 is the last line built on reqwest
# 0.12 (0.32+ pulls a second reqwest 0.13). OTLP over HTTP/protobuf only: tonic
# comes in for the generated message types, never its gRPC transport.
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
jsonschema = { version = "0.58", default-features = false }
