app = "nexusmind-backend"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "nexusmind_data"
  destination = "/data"

[env]
  DB_PATH = "/data/nexusmind.db"
  RUST_LOG = "info"
  COOKIE_SECURE = "true"
  ADMIN_ORIGIN = "https://admin.nexusmind.smartcoderlabs.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/v1/health"
    interval = "30s"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
