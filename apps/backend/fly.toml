app = "nexusmind-backend"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "nexusmind_data"
  destination = "/data"

[env]
  DB_PATH = "/data/nexusmind.db"
  RUST_LOG = "info"
  ADMIN_ORIGIN = "https://admin.nexusmind.smartcoderlabs.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/v1/health"
    interval = "30s"
    timeout = "5s"

[[vm]]
  # The nomic-embed embedding model alone loads ~274MB; 256MB OOM-killed the
  # machine during indexing. 1GB gives headroom for the model + repo content + SQLite.
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
