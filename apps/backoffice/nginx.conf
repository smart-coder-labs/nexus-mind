server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /v1/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /internal/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
}
