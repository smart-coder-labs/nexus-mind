<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try { const mode = localStorage.getItem('nexusmind-admin-theme') || 'light'; document.documentElement.classList.toggle('dark', mode === 'dark'); document.documentElement.dataset.theme = mode; } catch {}
    </script>
    <title>NexusMind</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
