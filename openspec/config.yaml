# SDD OpenSpec Config — nexus-mind
# Updated by sdd-init on 2026-06-29

project: nexus-mind

context: |
  Monorepo: Rust/Axum backend, React 19/Vite admin panel, React/Vite backoffice, Astro landing page.
  Active branch: feat/code-knowledge-graph (Phase 1 complete — tree-sitter AST chunker landed).
  Architecture: Clean/Hexagonal. Multi-tenant: every table scoped by org_id.
  Backend: Rust 2021/stable, Axum 0.7, rusqlite 0.31 bundled, fastembed 4 (nomic-embed-text 768-dim),
    tree-sitter 0.26 + grammars (rust/ts/js/py/go). SQLite migrations via PRAGMA user_version.
  Indexing pipeline: src/indexer/ (walker.rs, chunker.rs, tree_sitter_chunker.rs, mod.rs).
  Code API: src/api/code.rs — routes /v1/code/index, /search, /status/:project, /context.
  Frontend admin: React 19, TailwindCSS 4, TanStack Query v5, Vitest 2 + Testing Library.
  Deploy: backend → Fly.io; admin/backoffice → Cloudflare Pages. CI in .github/workflows/ci.yml.

strict_tdd: true
tdd_scope: backend_and_admin

testing:
  backend:
    strict_tdd: true
    test_command: "cargo test --manifest-path apps/backend/Cargo.toml"
    framework: "Rust built-in (libtest)"
    layers:
      unit: true
      integration: true
      e2e: false
    coverage:
      available: false
      command: "cargo tarpaulin (not configured in CI)"
    quality:
      linter: "cargo clippy --manifest-path apps/backend/Cargo.toml -- -D warnings"
      formatter: "cargo fmt"
      type_checker: "rustc (compile-time)"
    notes: |
      Extensive unit tests co-located in modules. Integration tests in tests/
      (http_auth_test.rs, integration_test.rs). CI runs clippy WITHOUT --all-targets.

  admin:
    strict_tdd: true
    test_command: "cd apps/admin && npm run test"
    framework: "Vitest 2 + @testing-library/react 16"
    layers:
      unit: true
      integration: true
      e2e: false
    coverage:
      available: false
      command: "vitest --coverage (not configured)"
    quality:
      build: "cd apps/admin && npm run build"
      type_checker: "tsc -b"
      notes: "Vitest + @testing-library/react + @testing-library/user-event installed. Test setup: src/test/setup.ts. jsdom environment."

  backoffice:
    strict_tdd: false
    test_command: null
    framework: null
    layers:
      unit: false
      integration: false
      e2e: false
    quality:
      build: "cd apps/backoffice && npm run build"
      notes: "No test runner — Standard Mode"

  landing:
    strict_tdd: false
    test_command: null
    framework: null
    quality:
      build: "astro build"

artifact_store: hybrid

phases:
  proposal:  { required_inputs: [],                    outputs: [proposal.md] }
  spec:      { required_inputs: [proposal.md],         outputs: [spec.md] }
  design:    { required_inputs: [proposal.md],         outputs: [design.md] }
  tasks:     { required_inputs: [spec.md, design.md],  outputs: [tasks.md] }
  apply:     { required_inputs: [tasks.md],            outputs: [apply-progress.md] }
  verify:    { required_inputs: [spec.md, tasks.md, apply-progress.md], outputs: [verify-report.md] }
  archive:   { required_inputs: [all],                 outputs: [archive-report.md] }
