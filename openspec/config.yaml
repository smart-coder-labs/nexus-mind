# SDD OpenSpec Config — nexus-mind
# Generated by sdd-init on 2026-06-10

project: nexus-mind

context: |
  Monorepo: Rust/Axum backend, React/Vite admin panel, React/Vite backoffice, Astro landing page.
  External MCP server (sibling repo). CI via .github/workflows/ci.yml.
  Architecture: Clean/Hexagonal. Backend: Rust 2021 edition, Axum, Cargo workspace.
  Frontend: React 18+, Vite, TypeScript. Landing: Astro.

strict_tdd: true
tdd_scope: backend_only

testing:
  backend:
    strict_tdd: true
    test_command: "cargo test"
    framework: "Rust built-in (libtest)"
    layers:
      unit: true
      integration: true
      e2e: false
    coverage:
      available: false
      command: "cargo tarpaulin (not yet configured)"
    quality:
      linter: "cargo clippy"
      formatter: "cargo fmt"
      type_checker: "rustc (compile-time)"
    notes: "98 tests, all green as of init date"

  admin:
    strict_tdd: false
    test_command: null
    framework: null
    layers:
      unit: false
      integration: false
      e2e: false
    quality:
      build: "npm run build"
      notes: "Vitest/RTL not yet installed — Standard Mode"

  backoffice:
    strict_tdd: false
    test_command: null
    framework: null
    layers:
      unit: false
      integration: false
      e2e: false
    quality:
      build: "npm run build"
      notes: "No test runner — Standard Mode"

  landing:
    strict_tdd: false
    test_command: null
    framework: null
    quality:
      build: "astro build"

artifact_store: hybrid

phases:
  proposal:  { required_inputs: [],                    outputs: [proposal.md] }
  spec:      { required_inputs: [proposal.md],         outputs: [spec.md] }
  design:    { required_inputs: [proposal.md],         outputs: [design.md] }
  tasks:     { required_inputs: [spec.md, design.md],  outputs: [tasks.md] }
  apply:     { required_inputs: [tasks.md],            outputs: [apply-progress.md] }
  verify:    { required_inputs: [spec.md, tasks.md, apply-progress.md], outputs: [verify-report.md] }
  archive:   { required_inputs: [all],                 outputs: [archive-report.md] }
