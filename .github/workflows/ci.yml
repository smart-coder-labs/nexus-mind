name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'docs/**']
  pull_request:
    branches: [main]

env:
  REGION: us-central1
  IMAGE_NAME: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/nexusmind/backend

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.85'
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend

      - name: Build
        run: cargo build --manifest-path apps/backend/Cargo.toml

      - name: Test
        run: cargo test --manifest-path apps/backend/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path apps/backend/Cargo.toml -- -D warnings

  admin:
    name: Admin Panel (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install deps
        run: cd apps/admin && npm ci

      - name: Build
        run: cd apps/admin && npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  mcp:
    name: MCP Server (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mcp/package-lock.json

      - name: Install deps + build
        run: cd apps/mcp && npm ci && npm run build

  e2e:
    name: E2E Smoke Test
    runs-on: ubuntu-latest
    needs: [backend, mcp]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.85'

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mcp/package-lock.json

      - name: Build MCP server
        run: cd apps/mcp && npm ci && npm run build

      - name: Seed demo data
        run: SKIP_BUILD=1 ./scripts/reset-demo.sh

      - name: Start backend
        run: cd apps/backend && ./target/release/nexusmind &
        env:
          RUST_LOG: info

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/v1/health && break
            sleep 1
          done
          curl -sf http://localhost:8080/v1/health || (echo "Backend never became healthy" && exit 1)

      - name: MCP smoke test
        run: ./scripts/test-mcp.sh
        env:
          NEXUSMIND_API_KEY: nm_demo_acme_sarah

  deploy:
    name: Deploy to GCP
    runs-on: ubuntu-latest
    needs: [backend, admin, mcp, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ── Backend image ──────────────────────────────────────────────────────

      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            apps/backend/

      - name: Push backend image
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy backend to GCE via SSH
        uses: google-github-actions/ssh-compute@v1
        with:
          instance_name: nexusmind-backend
          zone: us-central1-a
          ssh_private_key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          command: |
            bash /opt/nexusmind/deploy-backend.sh ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # ── Admin panel ────────────────────────────────────────────────────────

      - name: Set up Node (admin build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Build admin panel
        run: cd apps/admin && npm ci && npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy admin to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: ${{ secrets.GCP_PROJECT_ID }}
          target: admin
          channelId: live

      # ── Landing ────────────────────────────────────────────────────────────

      - name: Set up Node (landing build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json

      - name: Build landing
        run: cd apps/landing && npm ci && npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy landing to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: ${{ secrets.GCP_PROJECT_ID }}
          target: landing
          channelId: live
