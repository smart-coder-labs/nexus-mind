name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed applications
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      nexus_cli: ${{ steps.filter.outputs.nexus_cli }}
      admin: ${{ steps.filter.outputs.admin }}
      backoffice: ${{ steps.filter.outputs.backoffice }}
      factory_commands_image: ${{ steps.filter.outputs.factory_commands_image }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'scripts/reset-demo.sh'
              - 'scripts/test-mcp.sh'
            nexus_cli:
              - 'apps/nexus-cli/**'
            admin:
              - 'apps/admin/**'
            backoffice:
              - 'apps/backoffice/**'
            factory_commands_image:
              - 'apps/backend/factory-commands.Dockerfile'

  backend:
    name: Backend (Rust)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      # Full history: `migration::git_history` has a calibration test that runs
      # the connector over this repository's real commits. A shallow clone gives
      # it one commit and the test cannot do its job.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 'stable'
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend

      - name: Build
        run: cargo build --manifest-path apps/backend/Cargo.toml

      - name: Test
        run: cargo test --manifest-path apps/backend/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path apps/backend/Cargo.toml -- -D warnings

  nexus-cli:
    name: Nexus CLI (Rust)
    needs: changes
    if: needs.changes.outputs.nexus_cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 'stable'
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/nexus-cli

      - name: Test
        run: cargo test --manifest-path apps/nexus-cli/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path apps/nexus-cli/Cargo.toml -- -D warnings

  admin:
    name: Admin Panel (React)
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install deps
        run: cd apps/admin && npm ci

      - name: Build
        run: cd apps/admin && npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Test
        run: cd apps/admin && npm run test

  backoffice:
    name: Backoffice (React)
    needs: changes
    if: needs.changes.outputs.backoffice == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/backoffice/package-lock.json

      - name: Install deps
        run: cd apps/backoffice && npm ci

      - name: Build
        run: cd apps/backoffice && npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  factory-commands-image:
    name: Factory verification image (arm64)
    needs: changes
    if: needs.changes.outputs.factory_commands_image == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (read the current runtime base)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build verification image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/factory-commands.Dockerfile
          platforms: linux/arm64
          build-args: |
            BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/nexusmind-backend:main-arm64

  e2e:
    name: E2E Smoke Test
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    needs: [changes, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 'stable'

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend

      - name: Build release binaries
        run: cargo build --release --manifest-path apps/backend/Cargo.toml

      - name: Seed demo data
        run: SKIP_BUILD=1 ./scripts/reset-demo.sh

      - name: Start backend
        run: cd apps/backend && ./target/release/nexusmind &
        env:
          RUST_LOG: info

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/v1/health && break
            sleep 1
          done
          curl -sf http://localhost:8080/v1/health || (echo "Backend never became healthy" && exit 1)

      - name: MCP smoke test
        run: ./scripts/test-mcp.sh
        env:
          NEXUSMIND_API_KEY: nm_demo_acme_sarah
