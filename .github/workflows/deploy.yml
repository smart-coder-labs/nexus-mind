name: Deploy

on:
  push:
    branches: [main, agent/autonomous-agents-mvp]

# Both configured branches deploy to the same production services. Keep only the
# newest run so an older commit cannot roll out after a newer push.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend -> oracle (Oracle Cloud Ampere A1, ARM64) k3s cluster, served behind
  # the box's existing Traefik ingress in namespace `nexusmind` (deploy/oracle/k8s).
  # The old Fly deploy was retired after the DNS cutover of
  # api.nexusmind.smartcoderlabs.com -> the oracle IP. Fly is kept as a manual
  # rollback (flip the Cloudflare record back to nexusmind-backend.fly.dev).
  #
  # One-time prereqs (out of band, see deploy/oracle/k8s/README.md): namespace,
  # ghcr-pull + nexusmind-env secrets, cert-manager Issuer + Certificate, PVC seed.
  # ---------------------------------------------------------------------------
  backend-oracle-build:
    name: Build backend image (arm64) and push to GHCR
    # Native arm64 hosted runner — compiles the Rust backend directly on ARM.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      owner_lc: ${{ steps.vars.outputs.owner_lc }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase owner (GHCR requires lowercase paths)
        id: vars
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (push, via GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend (linux/arm64, native)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner_lc }}/nexusmind-backend:main-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  openshell-sandbox-build:
    name: Build OpenShell sandbox image (arm64) and push to GHCR
    needs: backend-oracle-build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push sandbox image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/nexus-cli/sandbox
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ needs.backend-oracle-build.outputs.owner_lc }}/nexusmind-openshell:main-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  factory-commands-build:
    name: Build verification commands image (arm64) and push to GHCR
    needs: backend-oracle-build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push commands image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/factory-commands.Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            BACKEND_IMAGE=ghcr.io/${{ needs.backend-oracle-build.outputs.owner_lc }}/nexusmind-backend:main-arm64
          tags: ghcr.io/${{ needs.backend-oracle-build.outputs.owner_lc }}/nexusmind-factory-commands:main-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend-oracle-deploy:
    name: Deploy backend to oracle (k3s) over SSH
    needs: [backend-oracle-build, openshell-sandbox-build, factory-commands-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply manifests and roll the deployment (kubectl on the box)
        env:
          SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXUS_OPENSHELL_IMAGE: ghcr.io/${{ needs.backend-oracle-build.outputs.owner_lc }}/nexusmind-openshell@${{ needs.openshell-sandbox-build.outputs.image_digest }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?missing ORACLE_SSH_HOST secret}"
          : "${SSH_USER:?missing ORACLE_SSH_USER secret}"
          : "${SSH_KEY:?missing ORACLE_SSH_KEY secret}"
          : "${NEXUS_OPENSHELL_IMAGE:?OpenShell sandbox image digest was not produced}"

          install -m 600 /dev/null /tmp/oracle_key
          printf '%s\n' "$SSH_KEY" > /tmp/oracle_key
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSHOPTS="-i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          REMOTE="${SSH_USER}@${SSH_HOST}"

          # `ubuntu` has kubectl on the box. Ship + apply the manifests, then roll
          # the deployment so the freshly built :main-arm64 digest is pulled
          # (imagePullPolicy: Always). Recreate strategy => brief (~40s) downtime.
          scp $SSHOPTS deploy/oracle/k8s/nexusmind.yaml "$REMOTE:/tmp/nexusmind.yaml"
          if [ -n "$SENTRY_DSN" ]; then
            printf '{"stringData":{"SENTRY_DSN":"%s"}}' "$SENTRY_DSN" | \
              ssh $SSHOPTS "$REMOTE" 'kubectl -n nexusmind patch secret nexusmind-env --type=merge --patch-file=/dev/stdin'
          fi
          ssh $SSHOPTS "$REMOTE" 'kubectl apply -f /tmp/nexusmind.yaml'
          ssh $SSHOPTS "$REMOTE" \
            "kubectl -n nexusmind set env deployment/nexusmind-backend -c autonomous-worker NEXUS_OPENSHELL_IMAGE=$NEXUS_OPENSHELL_IMAGE"
          ssh $SSHOPTS "$REMOTE" '
            set -e
            kubectl -n nexusmind rollout restart deploy/nexusmind-backend
            kubectl -n nexusmind rollout status deploy/nexusmind-backend --timeout=240s
            # The egress proxy runs the same backend image under the sandbox
            # namespace. Refresh it too so policy/allowlist code matches this
            # commit before the next verification replay. A zero-surge strategy
            # lets this complete when the one-node cluster has no free CPU.
            kubectl -n nexusmind-egress patch deployment factory-egress-proxy --type=merge --patch="{\"spec\":{\"strategy\":{\"type\":\"RollingUpdate\",\"rollingUpdate\":{\"maxUnavailable\":1,\"maxSurge\":0}}}}"
            kubectl -n nexusmind-egress rollout restart deploy/factory-egress-proxy
            kubectl -n nexusmind-egress rollout status deploy/factory-egress-proxy --timeout=240s
          '
          rm -f /tmp/oracle_key
          echo "oracle k8s deploy complete."

  admin:
    name: Deploy admin to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Build
        run: cd apps/admin && npm ci && npm run build
        env:
          VITE_API_URL: https://api.nexusmind.smartcoderlabs.com
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN_ADMIN }}
          VITE_SENTRY_ENVIRONMENT: production

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy apps/admin/dist --project-name=nexusmind-admin --branch=main

  landing:
    name: Deploy landing to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json

      - name: Build
        run: cd apps/landing && npm ci && npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN_LANDING }}
          PUBLIC_SENTRY_ENVIRONMENT: production

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy apps/landing/dist --project-name=nexusmind-landing --branch=main

  backoffice:
    name: Deploy backoffice to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/backoffice/package-lock.json

      - name: Build
        run: cd apps/backoffice && npm ci && npm run build
        env:
          VITE_API_URL: https://api.nexusmind.smartcoderlabs.com
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN_BACKOFFICE }}
          VITE_SENTRY_ENVIRONMENT: production

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy apps/backoffice/dist --project-name=nexusmind-backoffice --branch=main
